amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "/scan"

    laser_model_type: "likelihood_field"
    laser_max_range: 1.5
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0

    max_particles: 2000
    min_particles: 500

    pf_err: 0.05
    pf_z: 0.99

    update_min_a: 0.2
    update_min_d: 0.25

    resample_interval: 1
    transform_tolerance: 1.0

    tf_broadcast: true

    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 5.0
    initial_pose_a: 0.0
    first_map_only: false
